packages:
  - "packages/happy-app"
  - "packages/happy-agent"
  - "packages/happy-cli"
  - "packages/happy-server"
  - "packages/happy-server-self-host"
  - "packages/happy-wire"
  - "packages/happy-app-logs"
  - "packages/codium"

# pnpm 10 stopped reading these from package.json's "pnpm" field; this repo's
# copy had gone stale there and silently stopped applying.
overrides:
  whatwg-url: "14.2.0"
  parse-path: "7.0.3"
  "@types/parse-path": "7.0.3"
  # Forces a single React across the workspace: web-secure-encryption (a
  # transitive dep of rn-encryption) pins its own older react, which
  # expo-doctor flags as a duplicate native module.
  react: "19.2.0"

onlyBuiltDependencies:
  - "@more-tech/react-native-libsodium"
  - "@prisma/client"
  - "@prisma/engines"
  - "@shopify/react-native-skia"
  - "@tailwindcss/oxide"
  - "better-sqlite3"
  - "electron"
  - "esbuild"
  - "node-pty"
  - "prisma"
  - "sharp"
